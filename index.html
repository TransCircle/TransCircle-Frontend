<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TransCircle·跨环 | 故事分享</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('transcircle-theme')
          // Validate theme value — prevent invalid localStorage values from
          // causing CSS to fail (M1). Valid themes: light, dark.
          if (t !== 'light' && t !== 'dark') {
            t = null
          }
          if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', t)
        } catch(e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- 旧浏览器（不支持 ES modules，如 Android 4.4 WebView / Chrome 30）会整体跳过 type="module" 脚本，
         使本 SPA 不执行而白屏。此 non-module 脚本仅在无模块支持的浏览器上运行，补交一个友好提示。 -->
    <noscript>
      <p style="max-width:720px;margin:2rem auto;padding:1rem 1.25rem;font-family:sans-serif;color:#222;line-height:1.7;">本页面需要启用 JavaScript 才能正常显示。</p>
    </noscript>
    <script nomodule>
      (function () {
        var root = document.getElementById('root');
        if (!root) { return; }
        root.innerHTML =
          '<article style="max-width:720px;margin:2rem auto;padding:1rem 1.25rem;font-family:sans-serif;color:#222;line-height:1.7;">' +
            '<h2>浏览器版本过旧</h2>' +
            '<p>您当前使用的浏览器（Android 4.4 / Chrome 30）无法运行本站的现代界面，请升级系统或改用较新浏览器后再访问。</p>' +
            '<p><a href="https://transcircle.org/" rel="noopener">TransCircle 主页</a> · ' +
            '<a href="https://submit.transcircle.org" rel="noopener">投稿</a></p>' +
          '</article>';
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
