<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TransCircle · 跨圈故事</title>
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" sizes="any" />
  <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="header">
    <h1><img class="logoMark" src="/logo-mark.svg" width="36" height="36" alt="" aria-hidden="true" />TransCircle</h1>
    <p class="tagline">跨圈故事 · 由社区共建</p>
    <nav class="filter" id="filterNav">
      <button class="filterBtn active" data-cat="all">全部</button>
    </nav>
  </header>

  <main class="grid" id="storyGrid">
    <p class="loading">加载中...</p>
  </main>

  <footer class="footer">
    <p>
      想分享你的故事？
      <a href="https://submit.transcircle.org">前往投稿 →</a>
    </p>
    <p class="license">内容以 CC BY-NC-SA 4.0 授权发布</p>
  </footer>

  <!-- 旧浏览器（不支持 ES modules，如 Android 4.4 WebView / Chrome 30）会跳过 type="module" 的 main.js，
       故事列表不会加载，此 non-module 脚本把 "加载中" 替换为明确提示。 -->
  <script nomodule>
    (function () {
      var grid = document.getElementById('storyGrid');
      if (!grid) { return; }
      grid.innerHTML = '<p style="color:#666;">浏览器版本过旧，无法加载故事列表。请升级系统或改用较新浏览器后再访问。</p>';
    })();
  </script>
  <script type="module" src="/main.js"></script>
</body>
</html>
